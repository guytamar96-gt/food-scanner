<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<title>Guy's Log</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap">
<style>
/* Graphite: near-black, one lime accent, quiet cards. Scan view uses the Mono camera frame. */
:root {
  --bg: #0B0B0C; --panel: #151517; --panel2: #1C1C1F; --line: #26262A; --hair: #1F1F22;
  --text: #F4F4F5; --muted: #9A9AA3; --dim: #6B6B73;
  --accent: #C8F135; --accent-ink: #0B0B0C; --danger: #F87171; --warn: #F5B83D; --good: #C8F135;
  --protein: #60A5FA; --carbs: #F5B83D; --fat: #A78BFA;
  --display: "Inter Tight", Inter, system-ui, sans-serif;
  --radius: 20px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
body { padding-bottom: calc(92px + env(safe-area-inset-bottom)); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(14px + env(safe-area-inset-top)) 20px 10px; max-width: 600px; margin: 0 auto; }
.toprow { display: flex; align-items: center; gap: 10px; }
.toprow .ttl { flex: 1; min-width: 0; }
header h1 { font-family: var(--display); font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 0; line-height: 1.1; }
.sub { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.sync.busy i { background: var(--warn); }
.sync.err { color: var(--danger); }
.sync.err i { background: var(--danger); }
.ibtn { width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--panel); display: flex; align-items: center; justify-content: center; flex: none; }
.ibtn svg { width: 20px; height: 20px; fill: none; stroke: var(--text); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.todaybtn { background: rgba(200, 241, 53, .1); color: var(--accent); border: 0; border-radius: 99px; padding: 0 14px; height: 36px; font-size: 13px; font-weight: 600; flex: none; }
/* week strip */
.weekrow { display: grid; grid-template-columns: 28px minmax(0, 1fr) 28px; align-items: center; gap: 2px; margin-top: 12px; }
.weekrow .arr { width: 28px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center; }
.weekrow .arr svg { width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.weekrow .arr:disabled { opacity: .25; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.week button { border: 1px solid transparent; background: var(--panel); border-radius: 14px; padding: 7px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text); }
.week .wd { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.week .dn { font-family: var(--display); font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
.week .dt { width: 5px; height: 5px; border-radius: 50%; }
.week .has .dt { background: var(--accent); }
.week .today { border-color: #3A3A3F; }
.week button[aria-current="date"] { background: var(--accent); color: var(--accent-ink); }
.week button[aria-current="date"] .wd { color: var(--accent-ink); opacity: .7; }
.week button[aria-current="date"].has .dt { background: var(--accent-ink); }
.week button:disabled { opacity: .3; cursor: default; }
main { padding: 4px 20px 20px; max-width: 600px; margin: 0 auto; }
/* bottom nav */
nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-top: 1px solid var(--hair); padding: 6px max(6px, env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left)); }
nav .in { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; }
nav button { background: none; border: 0; color: #8A8A93; padding: 6px 0; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; }
nav button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav button[aria-selected="true"] { color: var(--accent); }
nav button.scanbtn .disc { width: 52px; height: 52px; border-radius: 26px; background: var(--accent); display: flex; align-items: center; justify-content: center; margin-top: -18px; box-shadow: 0 0 0 5px var(--bg); }
nav button.scanbtn .disc svg { stroke: var(--accent-ink); width: 24px; height: 24px; }
nav button.scanbtn[aria-selected="true"] { color: var(--accent); }
h2 { font-size: 12px; margin: 22px 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
h2 span, h2 button { text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 500; }
h2 button { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 0; }
.card { background: var(--panel); border-radius: var(--radius); padding: 18px; margin-bottom: 12px; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-weight: 600; border-radius: 16px; min-height: 52px; padding: 0 18px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; font-size: 16px; }
.btn.danger { color: var(--danger); }
.btn.block { width: 100%; margin-top: 10px; }
.btn.sm { min-height: 40px; border-radius: 12px; padding: 0 14px; font-size: 14px; }
.btn:disabled { opacity: .4; }
.link { background: none; border: 0; color: var(--muted); font-size: 14px; font-weight: 600; padding: 12px 4px; text-decoration: underline; text-underline-offset: 3px; }
.row { display: flex; gap: 10px; align-items: center; }
.row > * { flex: 1; }
input, select, textarea { width: 100%; background: var(--panel); color: var(--text); border: 1px solid transparent; border-radius: 14px; padding: 13px 14px; font-size: 16px; }
input:focus, select:focus, textarea:focus { border-color: var(--line); outline: none; }
textarea { min-height: 80px; font-size: 15px; resize: vertical; }
label.f { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 12px; }
label.f input, label.f select, label.f textarea { margin-top: 6px; background: var(--panel2); }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.grid4 label.f { margin-top: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.msg { background: var(--panel2); border-radius: 14px; padding: 12px 14px; font-size: 14px; margin: 12px 0; color: #D4D4D8; }
.msg.warn { color: #F3DFAE; }
.msg.err { color: #FCA5A5; }
.msg.ok { color: var(--accent); }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 99px; background: var(--panel2); color: var(--muted); }
.pill.new { color: var(--accent); background: rgba(200, 241, 53, .1); }
.pill.xs { font-size: 11px; padding: 3px 8px; }
/* scan: Mono-style frame */
.viewer { position: relative; border-radius: 6px; overflow: hidden; background: #050506; aspect-ratio: 1 / 1; max-height: 52vh; width: 100%; border: 1px solid var(--hair); }
.viewer video { width: 100%; height: 100%; object-fit: cover; display: block; }
.viewer .corner { position: absolute; width: 20px; height: 20px; border: 0 solid #fff; pointer-events: none; }
.viewer .tl { left: 12%; top: 32%; border-left-width: 2px; border-top-width: 2px; }
.viewer .tr { right: 12%; top: 32%; border-right-width: 2px; border-top-width: 2px; }
.viewer .bl { left: 12%; bottom: 32%; border-left-width: 2px; border-bottom-width: 2px; }
.viewer .br { right: 12%; bottom: 32%; border-right-width: 2px; border-bottom-width: 2px; }
.viewer .line { position: absolute; left: 12%; right: 12%; top: 50%; height: 1px; background: var(--accent); pointer-events: none; }
.viewer .cap { position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #B9B9C0; pointer-events: none; }
.viewer .idle { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--muted); text-align: center; padding: 24px; background: #050506; }
.viewer .torch { position: absolute; right: 12px; top: 12px; width: 44px; height: 44px; border-radius: 22px; background: rgba(255, 255, 255, .1); border: 0; display: flex; align-items: center; justify-content: center; }
.viewer .torch svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.search { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #3A3A3F; margin-top: 18px; }
.search input { background: none; border: 0; border-radius: 0; padding: 14px 0; }
.search svg { width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; flex: none; }
/* lists */
.list .item { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--hair); }
.list .item:last-child { border-bottom: 0; }
.list .item .t { flex: 1; min-width: 0; }
.list .item .n { font-weight: 600; overflow-wrap: anywhere; }
.list .item .s { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.list .item .k { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
.list .item .k small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
.list .item .av { width: 40px; height: 40px; border-radius: 12px; background: var(--panel2); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--accent); flex: none; }
.list .item .plus { width: 18px; height: 18px; fill: none; stroke: var(--dim); stroke-width: 2; stroke-linecap: round; flex: none; }
.tap { cursor: pointer; }
.empty { color: var(--muted); font-size: 14px; padding: 10px 0; }
/* product */
.hero { background: var(--panel); border-radius: 24px; padding: 22px; margin: 16px 0; }
.hero .big { display: flex; align-items: baseline; gap: 8px; }
.hero .big b { font-family: var(--display); font-size: 56px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.hero .big span { font-size: 15px; color: var(--muted); }
.macros3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
.macros3 i { display: block; height: 4px; border-radius: 2px; margin-bottom: 8px; }
.macros3 b { display: block; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.macros3 span { font-size: 12px; color: var(--muted); }
.lbl { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 10px; display: block; }
.stepper { display: flex; align-items: center; gap: 8px; height: 60px; border-radius: 16px; background: var(--panel); padding: 0 8px; }
.stepper button { width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--panel2); font-size: 22px; flex: none; }
.stepper input { flex: 1; min-width: 0; background: none; border: 0; text-align: center; font-family: var(--display); font-size: 24px; font-weight: 700; padding: 0; }
.stepper .unit { font-size: 15px; color: var(--muted); margin-right: 4px; }
.keep { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; padding: 14px 16px; background: var(--panel2); border-radius: 14px; font-size: 15px; }
.keep small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.keep input { width: 22px; height: 22px; accent-color: var(--accent); flex: 0 0 auto; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.quick button { background: var(--panel2); border: 0; border-radius: 99px; padding: 9px 13px; font-size: 13px; color: #D4D4D8; min-height: 36px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--panel); border-radius: 14px; padding: 4px; }
.seg button { background: none; border: 0; color: var(--muted); font-size: 13px; padding: 11px 0; border-radius: 10px; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); font-weight: 600; }
.per100 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 16px; font-size: 13px; color: var(--muted); }
.per100 b { color: var(--text); font-weight: 600; }
details summary { cursor: pointer; list-style: none; }
details summary::-webkit-details-marker { display: none; }
/* today */
.daytype { background: var(--panel); border: 0; border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 600; min-height: 32px; color: var(--muted); }
.daytype.on { background: rgba(200, 241, 53, .12); color: var(--accent); }
.summary { display: flex; align-items: center; gap: 20px; }
.ring { position: relative; width: 132px; height: 132px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .c b { font-family: var(--display); font-size: 30px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.ring .c span { font-size: 12px; color: var(--muted); }
.mbars { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.mbars .r1 { display: flex; justify-content: space-between; font-size: 13px; }
.mbars .r1 span { color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.sumline { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--hair); font-size: 13px; color: var(--muted); align-items: center; }
@media (max-width: 360px) { .summary { flex-direction: column; } .mbars { width: 100%; } }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
.tile { background: var(--panel); border: 0; border-radius: 18px; padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; gap: 4px; align-items: center; }
.tile .v { font-family: var(--display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; line-height: 1.15; }
.tile .v small { font-family: Inter, sans-serif; font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.tile .bar { height: 4px; }
.watch { width: 14px; height: 14px; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.water { display: flex; align-items: center; gap: 14px; }
.water .amt { flex: 1; min-width: 0; }
.water .amt b { font-family: var(--display); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.water .amt span { color: var(--muted); font-size: 13px; }
.wbtns { display: grid; grid-template-columns: repeat(3, auto); gap: 6px; margin-top: 12px; }
.wbtns button { background: var(--panel2); border: 0; border-radius: 12px; height: 42px; padding: 0 16px; font-weight: 600; font-size: 14px; }
.chiprow { margin-top: 14px; }
.chiprow:first-child { margin-top: 0; }
.chiprow .lab { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.chiprow .lab span { color: var(--muted); font-weight: 500; font-size: 12px; }
.chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.chips button { height: 42px; border-radius: 12px; border: 0; background: var(--panel2); font-weight: 700; font-family: var(--display); font-size: 16px; }
.chips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.stages { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; margin: 10px 0 6px; }
.stages i { display: block; height: 100%; }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.legend i.ln { width: 14px; height: 3px; border-radius: 2px; vertical-align: 3px; }
/* sessions */
.sess + .sess { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 18px; }
.sess-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sess-d b { font-family: var(--display); font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
.sess-d span { color: var(--muted); font-size: 14px; margin-left: 8px; }
.sess-t { font-weight: 600; margin-top: 2px; overflow-wrap: anywhere; }
.sess-t .score { font-family: var(--display); font-weight: 700; color: var(--accent); margin-left: 6px; }
.sess-m { font-size: 13px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.sess pre { margin: 10px 0 0; font: 13px/1.45 Inter, sans-serif; color: #D4D4D8; white-space: pre-wrap; overflow-wrap: anywhere; }
.sess-n { font-size: 13px; color: #D4D4D8; background: var(--panel2); border-radius: 12px; padding: 10px 12px; margin-top: 12px; white-space: pre-wrap; }
.sess-a { display: flex; gap: 18px; margin-top: 4px; }
.sess-a .link { font-size: 13px; padding: 8px 0 0; }
.part { margin-top: 14px; padding-left: 12px; border-left: 2px solid var(--line); }
.part-h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.part-h b { text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.mv { display: flex; width: 100%; align-items: center; gap: 10px; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--hair); padding: 10px 0; color: var(--text); }
.mv:last-child { border-bottom: 0; }
.mv .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.mv .n { font-weight: 600; overflow-wrap: anywhere; }
.mv .s { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.cmp { flex: none; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 99px; background: var(--panel2); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.cmp.up { color: var(--accent); background: rgba(200, 241, 53, .12); }
.cmp.down { color: var(--warn); background: rgba(245, 184, 61, .1); }
.cmp.new { color: var(--protein); background: rgba(96, 165, 250, .1); }
.pill.prb { background: var(--accent); color: var(--accent-ink); }
.gchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.gchips span { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--panel2); color: var(--muted); }
.gchips.big span { color: var(--dim); }
.gchips.big span.on { background: rgba(200, 241, 53, .12); color: var(--accent); }
.gchips.big span.miss { color: var(--warn); }
.wk-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.wk-h b { font-family: var(--display); font-size: 19px; font-weight: 700; }
.wk-h span { font-size: 13px; color: var(--muted); }
.wk-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
.wk-days button { background: var(--panel2); border: 1px solid transparent; border-radius: 10px; padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--muted); font-size: 11px; font-weight: 600; }
.wk-days i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.wk-days .on i { background: var(--accent); }
.wk-days .sel { border-color: #3A3A3F; color: var(--text); }
.wk-days button:disabled { opacity: .3; }
.upc { color: var(--accent); }
.mchart { display: block; width: 100%; height: auto; }
.mchart .ax { fill: var(--dim); font-size: 11px; font-family: Inter, sans-serif; }
.fpart { background: var(--panel); border-radius: 16px; padding: 12px; margin-bottom: 10px; }
.fpart input { background: var(--panel2); padding: 10px 12px; }
.fmove { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.fsets { display: grid; grid-template-columns: 22px repeat(3, minmax(0, 1fr)) 32px; gap: 6px; margin-top: 8px; align-items: center; }
.fs-h { font-size: 11px; color: var(--muted); font-weight: 600; }
.fs-n { font-size: 13px; color: var(--muted); text-align: center; }
.x.sm { width: 32px; height: 32px; font-size: 16px; border-radius: 16px; flex: 0 0 auto; }
.each { flex: 1; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.each input { width: auto; }
/* workouts */
.wod { padding: 13px 0; border-bottom: 1px solid var(--hair); }
.wod:last-child { border-bottom: 0; }
.wod .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.wod .name { font-weight: 700; }
.wod .score { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; }
.wod pre { margin: 6px 0 0; font: 13px/1.45 Inter, sans-serif; color: #D4D4D8; white-space: pre-wrap; overflow-wrap: anywhere; }
.wod .notes { font-size: 13px; color: var(--muted); white-space: pre-wrap; margin-top: 4px; }
.prgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.pr { border: 0; background: var(--panel2); border-radius: 14px; padding: 12px; text-align: left; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pr .n { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; color: #D4D4D8; }
.pr .b { font-family: var(--display); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pr .b.none { color: var(--dim); font-size: 14px; font-weight: 600; font-family: Inter, sans-serif; }
.pr .d { font-size: 11px; color: var(--muted); }
/* progress */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.kpi .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.kpi .v { font-family: var(--display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: 12px; color: var(--muted); font-family: Inter, sans-serif; font-weight: 500; }
.kpi .v.down { color: var(--accent); }
.kpi .v.up { color: var(--warn); }
.chartbox { position: relative; margin-top: 14px; }
.chartbox svg { display: block; width: 100%; height: 220px; overflow: visible; }
.chartbox .axis { fill: var(--dim); font-size: 11px; font-family: Inter, sans-serif; }
.chartbox .grid { stroke: var(--hair); stroke-width: 1; }
.tip { position: absolute; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 10px; white-space: nowrap; transform: translate(-50%, -120%); }
.tablewrap { overflow-x: auto; margin: 0 -4px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 4px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--hair); }
th:first-child, td:first-child { text-align: left; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
td.hit { color: var(--accent); font-weight: 700; }
tr.avg td { font-weight: 700; border-bottom: 0; }
tr.sel td { background: rgba(255, 255, 255, .03); }
.streaks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; text-align: center; }
.streaks b { display: block; font-family: var(--display); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.streaks span { font-size: 12px; color: var(--muted); }
/* sheets */
.sheet-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, .65); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 600px; max-height: 94vh; overflow: auto; border-radius: 28px 28px 0 0; padding: 18px 20px calc(24px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
.sheet h3 { margin: 0; font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.sheet .top { display: flex; align-items: flex-start; gap: 12px; }
.sheet .top h3 { flex: 1; padding-top: 6px; }
.x { background: var(--panel); border: 0; border-radius: 22px; width: 44px; height: 44px; font-size: 20px; flex: none; }
.toast { position: fixed; left: 50%; bottom: calc(104px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 99px; font-size: 14px; font-weight: 600; z-index: 30; max-width: 90vw; text-align: center; white-space: nowrap; }
ol.steps { padding-left: 20px; margin: 8px 0; font-size: 14px; }
ol.steps li { margin-bottom: 8px; }
a { color: var(--accent); }
code { background: var(--panel2); padding: 1px 6px; border-radius: 6px; font-size: 13px; overflow-wrap: anywhere; }
[dir="auto"] { unicode-bidi: plaintext; text-align: left; }
</style>
</head>
<body>
<header>
  <div class="toprow">
    <div class="ttl"><h1 id="title">Today</h1><div class="sub"><span id="subtitle"></span><span id="sync" class="sync"></span></div></div>
    <button class="todaybtn" id="goToday" hidden>Today</button>
    <button class="ibtn" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
  </div>
  <div class="weekrow" id="weekrow">
    <button class="arr" id="prevWeek" aria-label="Previous week"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="week" id="week" role="group" aria-label="Days of the week"></div>
    <button class="arr" id="nextWeek" aria-label="Next week"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
</header>
<main id="view"></main>
<nav><div class="in">
  <button data-tab="today" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Today</button>
  <button data-tab="food" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 21V3c-2 1-3 4-3 8h3"/></svg>Food</button>
  <button data-tab="scan" class="scanbtn" aria-selected="false"><span class="disc"><svg viewBox="0 0 24 24"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M8 8v8M12 8v8M16 8v8"/></svg></span>Scan</button>
  <button data-tab="train" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg>Training</button>
  <button data-tab="progress" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Progress</button>
</div></nav>
<div id="sheetRoot"></div>
<script>
'use strict';
// ---------- config ----------
const REPO = 'guytamar96-gt/food-scanner';      // public: app code + food catalogue
const FILE = 'foods.csv';
const DATA_REPO = 'guytamar96-gt/training-data'; // private: Guy's daily logs and watch data
const MEALS = ['Breakfast', 'Lunch', 'Dinner', 'Snacks'];
const COLS = ['id', 'barcode', 'name', 'brand', 'kcal', 'protein', 'carbs', 'fat', 'sugar', 'sat_fat', 'fibre', 'sodium_mg', 'serving_g', 'source', 'added'];
const NUMS = ['kcal', 'protein', 'carbs', 'fat', 'sugar', 'sat_fat', 'fibre', 'sodium_mg', 'serving_g'];
const DEFAULT_TARGETS = { rest: { kcal: 1750, p: 150, c: 165, f: 55, water: 2800 }, train: { kcal: 2000, p: 170, c: 205, f: 55, water: 3500 }, steps: 9000, sleep: 7.5 };
const LS = { cat: 'fs-catalogue', pending: 'fs-pending', days: 'fs-days', token: 'fs-token', targets: 'fs-targets', train: 'fs-train', sha: 'fs-sha',
  log: 'fs-log', lsha: 'fs-log-sha', ldirty: 'fs-log-dirty', health: 'fs-health', migrated: 'fs-migrated-v1' };
const LIFTS = ['Back squat', 'Front squat', 'Deadlift', 'Bench press', 'Strict press', 'Push press', 'Clean', 'Clean & jerk', 'Snatch', 'Thruster'];
const BENCH = [
  ['Fran', 'time', '21-15-9 thrusters 43 kg, pull-ups'], ['Grace', 'time', '30 clean & jerks 61 kg'], ['Isabel', 'time', '30 snatches 61 kg'],
  ['Diane', 'time', '21-15-9 deadlifts 102 kg, HSPU'], ['Helen', 'time', '3 rounds: 400 m run, 21 KB swings 24 kg, 12 pull-ups'],
  ['Karen', 'time', '150 wall balls 9 kg'], ['Cindy', 'rounds', '20 min AMRAP: 5 pull-ups, 10 push-ups, 15 air squats'],
  ['Murph', 'time', '1.6 km run, 100 pull-ups, 200 push-ups, 300 squats, 1.6 km run (vest)']
];

// ---------- helpers ----------
const $ = id => document.getElementById(id);
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function num(v) { if (v === '' || v == null) return null; const n = Number(String(v).replace(',', '.')); return isFinite(n) ? n : null; }
function r1(n) { return Math.round(n * 10) / 10; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function ymd(d = new Date()) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseD(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function shift(s, n) { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); }
function fmtDate(s, o = { weekday: 'short', day: 'numeric', month: 'short' }) { return parseD(s).toLocaleDateString('en-GB', o); }
function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9֐-׿]+/g, '-').replace(/^-|-$/g, '').slice(0, 50) || uid(); }
function load(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2400); }
function utf8ToB64(s) { const b = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(bin); }
function b64ToUtf8(s) { const bin = atob(s.replace(/\s/g, '')); const b = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return new TextDecoder().decode(b); }
function defaultMeal() { const h = new Date().getHours(); return h < 11 ? 'Breakfast' : h < 16 ? 'Lunch' : h < 18 ? 'Snacks' : 'Dinner'; }
const FIRST_DAY = (() => { try { const l = new Intl.Locale(navigator.language || 'en'); const w = (l.getWeekInfo && l.getWeekInfo()) || l.weekInfo; if (w && w.firstDay) return w.firstDay % 7; } catch (e) {} return 0; })(); // 0 = Sunday
function weekStart(s) { const d = parseD(s); return shift(s, -((d.getDay() - FIRST_DAY + 7) % 7)); }
function avgOf(arr) { const v = arr.filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; }

// ---------- CSV ----------
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); f = ''; if (row.length > 1 || row[0] !== '') rows.push(row); row = []; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  const head = rows.shift() || [];
  return rows.map(r => { const o = {}; head.forEach((h, i) => { o[h] = r[i] ?? ''; }); for (const k of NUMS) o[k] = num(o[k]); return o; }).filter(o => o.id);
}
function toCSV(list) {
  const cell = v => { v = v == null ? '' : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const sorted = list.slice().sort((a, b) => (a.added || '').localeCompare(b.added || '') || a.name.localeCompare(b.name));
  return '﻿' + [COLS.join(','), ...sorted.map(o => COLS.map(k => cell(o[k])).join(','))].join('\n') + '\n';
}

// ---------- state ----------
const S = {
  tab: 'today', date: ymd(), scanMeal: null, prMode: 'lift', chartRange: 30,
  cat: load(LS.cat, []),              // last known catalogue from GitHub
  pending: load(LS.pending, []),      // [{op:'put',food}|{op:'del',id}] not yet saved to GitHub
  token: load(LS.token, ''),
  targets: Object.assign(clone(DEFAULT_TARGETS), load(LS.targets, {})),
  sha: load(LS.sha, null),
  syncing: false, syncErr: null,
  log: Object.assign({ days: {}, prs: {}, meas: {}, profile: {}, templates: {}, coach: null }, load(LS.log, {})),
  lsha: load(LS.lsha, {}),            // GitHub sha of each log file as last seen
  ldirty: load(LS.ldirty, []),        // log files changed on this phone and not yet saved
  lgen: {}, lsyncing: false, lerr: null, lastPull: 0,
  health: load(LS.health, {}),        // watch data per day, written by the Samsung relay
};
// older saved targets only had kcal + protein
for (const k of ['rest', 'train']) S.targets[k] = Object.assign({}, DEFAULT_TARGETS[k], S.targets[k] || {});
// carbs and fat had no default before; fill them so Settings shows the numbers in use
for (const k of ['rest', 'train']) for (const m of ['c', 'f']) if (S.targets[k][m] == null) S.targets[k][m] = DEFAULT_TARGETS[k][m];
function foods() { // catalogue with this phone's unsynced edits applied
  const m = new Map(S.cat.map(f => [f.id, f]));
  for (const p of S.pending) { if (p.op === 'put') m.set(p.food.id, p.food); else m.delete(p.id); }
  return [...m.values()];
}
// foods typed in without a weight are stored per portion: the per-100 columns hold one portion
function isPortion(f) { return f && f.source === 'portion'; }
function perWord(f) { return isPortion(f) ? 'per portion' : 'per 100 g'; }
function byBarcode(code) { return foods().find(f => f.barcode && f.barcode === code); }

function putFood(food) {
  S.pending = S.pending.filter(p => (p.op === 'put' ? p.food.id : p.id) !== food.id);
  S.pending.push({ op: 'put', food }); save(LS.pending, S.pending); sync();
}
function delFood(id) {
  S.pending = S.pending.filter(p => (p.op === 'put' ? p.food.id : p.id) !== id);
  S.pending.push({ op: 'del', id }); save(LS.pending, S.pending); sync();
}

// ---------- days ----------
function blankDay(date) { return { date, weight: null, water_ml: 0, steps: null, sleep_h: null, sleep_q: null, energy: null, soreness: null, note: '', train: null, food: [], workouts: [] }; }
function normDay(d) { d = Object.assign(blankDay(d.date), d); if (!Array.isArray(d.food)) d.food = []; if (!Array.isArray(d.workouts)) d.workouts = []; return d; }
function day(date = S.date) { return S.log.days[date] ? S.log.days[date] : blankDay(date); }
function editDay(date, fn) {
  const d = clone(day(date)); fn(d); d.updatedAt = new Date().toISOString();
  S.log.days[date] = d; markDirty('days/' + date + '.json');
}
function isTrain(d) { return d.train === true || (d.train !== false && d.workouts.length > 0); }
function totals(items) { const t = { kcal: 0, p: 0, c: 0, f: 0 }; for (const e of items) { t.kcal += e.kcal || 0; t.p += e.p || 0; t.c += e.c || 0; t.f += e.f || 0; } return t; }
function targetsFor(date) {
  const d = day(date), tr = isTrain(d), key = tr ? 'train' : 'rest', mine = S.targets[key], coach = S.log.coach || {}, c = coach[key] || {};
  const pick = (a, b) => a != null ? a : b, D = DEFAULT_TARGETS[key];
  return { train: tr, kcal: pick(c.kcal, mine.kcal), p: pick(c.p, mine.p), c: pick(c.c, pick(mine.c, D.c)), f: pick(c.f, pick(mine.f, D.f)), water: pick(c.water_ml, mine.water), steps: pick(coach.steps, S.targets.steps), sleep: pick(coach.sleep_h, S.targets.sleep), coach: !!coach[key] };
}
// watch values win where the relay has them; typed values fill the gaps
function H(date) { return S.health[date] || null; }
function stepsOf(date) { const h = H(date); return h && h.steps != null ? { v: h.steps, watch: true } : { v: day(date).steps, watch: false }; }
function sleepOf(date) { const h = H(date); return h && h.sleep && h.sleep.minutes ? { v: r1(h.sleep.minutes / 60), watch: true } : { v: day(date).sleep_h, watch: false }; }
function weightOf(date) { const d = day(date), h = H(date); return d.weight != null ? d.weight : h && h.weight_kg != null ? r1(h.weight_kg) : null; }
function latestWeight() { const ds = new Set([...Object.keys(S.log.days), ...Object.keys(S.health)]); let best = null; for (const s of ds) { const w = weightOf(s); if (w != null && (!best || s > best.date)) best = { date: s, w }; } return best; }

// ---------- move the old scanner day log into the new one (runs once) ----------
(function migrate() {
  if (load(LS.migrated, false)) return;
  const old = load(LS.days, {}), train = load(LS.train, {});
  for (const [date, items] of Object.entries(old)) {
    if (!Array.isArray(items) || !items.length) continue;
    const d = normDay(clone(S.log.days[date] || blankDay(date)));
    for (const e of items) if (!d.food.some(x => x.id === e.id)) { const c = Object.assign({}, e); delete c.date; d.food.push(c); }
    d.updatedAt = new Date().toISOString(); S.log.days[date] = d;
    if (!S.ldirty.includes('days/' + date + '.json')) S.ldirty.push('days/' + date + '.json');
  }
  for (const date of Object.keys(train)) { if (!train[date]) continue; const d = normDay(clone(S.log.days[date] || blankDay(date))); d.train = true; d.updatedAt = new Date().toISOString(); S.log.days[date] = d; if (!S.ldirty.includes('days/' + date + '.json')) S.ldirty.push('days/' + date + '.json'); }
  save(LS.log, S.log); save(LS.ldirty, S.ldirty); save(LS.migrated, true);
})();

// ---------- GitHub: catalogue (public repo) ----------
function setSync() {
  const el = $('sync'); if (!el) return;
  const n = S.pending.length + S.ldirty.length, busy = S.syncing || S.lsyncing, err = S.syncErr || S.lerr;
  el.className = 'sync' + (err ? ' err' : busy || n ? ' busy' : '');
  el.innerHTML = '<i></i>' + esc(!S.token ? 'On this phone only' : busy ? 'Saving…' : err ? err : n ? `${n} not saved yet` : 'Saved');
}
async function ghr(repo, path, opts = {}) {
  const r = await fetch('https://api.github.com/repos/' + repo + path, Object.assign({}, opts, { headers: Object.assign({ Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + S.token, 'X-GitHub-Api-Version': '2022-11-28' }, opts.headers || {}) }));
  if (!r.ok) { const e = new Error('github ' + r.status); e.status = r.status; throw e; }
  return r.json();
}
function gh(path, opts) { return ghr(REPO, path, opts); }
async function pull() {
  try {
    if (S.token) {
      const j = await gh('/contents/' + FILE + '?ref=main&t=' + Date.now(), { cache: 'no-store' });
      S.sha = j.sha; save(LS.sha, S.sha);
      S.cat = parseCSV(b64ToUtf8(j.content || ''));
    } else {
      const r = await fetch(FILE + '?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('csv ' + r.status);
      S.cat = parseCSV(await r.text());
    }
    save(LS.cat, S.cat); S.syncErr = null;
  } catch (e) {
    S.syncErr = e.status === 401 || e.status === 403 ? 'GitHub key not accepted' : navigator.onLine ? 'Couldn’t load catalogue' : 'Offline';
  }
}
let syncTimer = null;
function sync() { clearTimeout(syncTimer); syncTimer = setTimeout(push, 400); setSync(); }
async function push(retry = true) {
  if (S.syncing) return sync();
  if (!S.pending.length) { setSync(); return; }
  if (!S.token) { S.syncErr = null; setSync(); return; }
  S.syncing = true; setSync();
  const batch = S.pending.slice();
  try {
    await pull();
    if (S.syncErr) throw new Error(S.syncErr);
    const m = new Map(S.cat.map(f => [f.id, f]));
    for (const p of batch) { if (p.op === 'put') m.set(p.food.id, p.food); else m.delete(p.id); }
    const list = [...m.values()];
    const names = batch.filter(p => p.op === 'put').map(p => p.food.name);
    const msg = names.length === 1 ? 'Add ' + names[0] : names.length ? `Update ${names.length} foods` : 'Remove food';
    const j = await gh('/contents/' + FILE, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: msg, content: utf8ToB64(toCSV(list)), sha: S.sha || undefined, branch: 'main' }) });
    S.sha = j.content.sha; save(LS.sha, S.sha);
    S.cat = list; save(LS.cat, S.cat);
    S.pending = S.pending.filter(p => !batch.includes(p)); save(LS.pending, S.pending);
    S.syncErr = null;
  } catch (e) {
    if ((e.status === 409 || e.status === 422) && retry) { S.syncing = false; return push(false); }
    S.syncErr = e.status === 401 || e.status === 403 || e.status === 404 ? 'GitHub key not accepted' : 'Not saved yet, will retry';
  }
  S.syncing = false; setSync();
  if (S.tab === 'food' || S.tab === 'settings') render();
}

// ---------- GitHub: daily log (private repo) ----------
// Files: days/YYYY-MM-DD.json, prs.json, measurements.json, profile.json, templates.json (written here);
// targets.json (written by the coach) and health/YYYY-MM-DD.json (written by the Samsung relay) are read only.
const ROOT_FILES = { 'prs.json': 'prs', 'measurements.json': 'meas', 'profile.json': 'profile', 'templates.json': 'templates', 'targets.json': 'coach' };

async function getFile(path) {

async function listDir(dir) { try { return await ghr(DATA_REPO, '/contents/' + dir + '?t=' + Date.now(), { cache: 'no-store' }); } catch (e) { if (e.status === 404 && dir) return []; throw e; } }
async function logPull() {
  if (!S.token) return;
  S.lastPull = Date.now();
  try {
    const root = await listDir('');
    const want = [];
    for (const it of root) if (it.type === 'file' && ROOT_FILES[it.name] && it.sha !== S.lsha[it.name] && !S.ldirty.includes(it.name)) want.push(it);
    const since = shift(ymd(), -120), hsince = shift(ymd(), -45);
    if (root.some(it => it.name === 'days')) for (const it of await listDir('days')) { const p = 'days/' + it.name; if (/^\d{4}-\d\d-\d\d\.json$/.test(it.name) && it.name >= since && it.sha !== S.lsha[p] && !S.ldirty.includes(p)) want.push(Object.assign({}, it, { path: p })); }
    if (root.some(it => it.name === 'health')) for (const it of await listDir('health')) { const p = 'health/' + it.name; if (/^\d{4}-\d\d-\d\d\.json$/.test(it.name) && it.name >= hsince && it.sha !== S.lsha[p]) want.push(Object.assign({}, it, { path: p })); }

      await Promise.all(want.slice(i, i + 6).map(async it => {
        const path = it.path || it.name, f = await getFile(path);
        if (!f || S.ldirty.includes(path)) return;
        S.lsha[path] = f.sha; if (f.obj) applyRemote(path, f.obj);
      }));
    }
    S.lerr = null;
    save(LS.lsha, S.lsha); saveLog(); save(LS.health, S.health);
  } catch (e) { S.lerr = logErr(e); }
  setSync();
}
async function syncAll() { await logPull(); render(); logPush(); }
window.addEventListener('online', () => { sync(); logPush(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - S.lastPull > 60000) syncAll(); });

// ---------- Open Food Facts ----------
async function lookupOFF(code) {
  const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=code,product_name,product_name_he,product_name_en,brands,nutriments,serving_quantity`);
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('off ' + r.status);
  const j = await r.json();
  if (!j || j.status !== 1 || !j.product) return null;
  const p = j.product, n = p.nutriments || {};
  const g = k => num(n[k + '_100g']);
  let kcal = g('energy-kcal'); if (kcal == null && g('energy') != null) kcal = g('energy') / 4.184;
  const sodium = g('sodium') != null ? g('sodium') * 1000 : g('salt') != null ? g('salt') * 400 : null;
  return {
    id: code, barcode: code,
    name: (p.product_name_he || p.product_name || p.product_name_en || '').trim(),
    brand: (p.brands || '').split(',')[0].trim(),
    kcal: kcal == null ? null : Math.round(kcal), protein: r1n(g('proteins')), carbs: r1n(g('carbohydrates')), fat: r1n(g('fat')),
    sugar: r1n(g('sugars')), sat_fat: r1n(g('saturated-fat')), fibre: r1n(g('fiber')), sodium_mg: sodium == null ? null : Math.round(sodium),
    serving_g: num(p.serving_quantity) || null, source: 'Open Food Facts', added: ymd(),
  };
}
function r1n(v) { return v == null ? null : r1(v); }

// ---------- camera scanning ----------
const CAM = { stream: null, detector: null, raf: 0, busy: false, torch: false, used: false, last: '', lastAt: 0 };
async function startCamera() {
  stopCamera();
  const v = $('video'); if (!v) return;
  const idle = $('idle'); if (idle) idle.innerHTML = '<div class="small">Starting camera…</div>';
  try {
    CAM.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  } catch (e) {
    if (idle) idle.innerHTML = `<div>${e && e.name === 'NotAllowedError' ? 'Camera permission was blocked. Allow the camera for this site in your browser settings, then try again.' : 'Couldn’t open the camera.'}</div><button class="btn" data-act="startCam">Try again</button>`;
    return;
  }
  if (S.tab !== 'scan' || !$('video')) { stopCamera(); return; } // left the scan tab while the camera was starting
  CAM.used = true;
  v.srcObject = CAM.stream; v.setAttribute('playsinline', ''); v.muted = true;
  await v.play().catch(() => {});
  if (!CAM.stream) return; // stopped while starting
  if (idle) idle.hidden = true;
  const track = CAM.stream.getVideoTracks()[0];
  const caps = track && track.getCapabilities ? track.getCapabilities() : {};
  if (caps.torch && $('torch')) $('torch').hidden = false;
  if ('BarcodeDetector' in window) {
    try {
      const fmts = await BarcodeDetector.getSupportedFormats();
      const want = ['ean_13', 'ean_8', 'upc_a', 'upc_e'].filter(f => fmts.includes(f));
      if (want.length) CAM.detector = new BarcodeDetector({ formats: want });
    } catch (e) { CAM.detector = null; }
  }
  if (!CAM.stream) return;
  if (!CAM.detector) await startZXing(v);
  else loopDetect(v);
}
function loopDetect(v) {
  const tick = async () => {
    if (!CAM.stream) return;
    if (!CAM.busy && v.readyState >= 2) {
      CAM.busy = true;
      try { const r = await CAM.detector.detect(v); const hit = r && r.find(x => /^\d{8,14}$/.test(x.rawValue) && fresh(x.rawValue)); if (hit) { onCode(hit.rawValue); CAM.busy = false; return; } } catch (e) {}
      CAM.busy = false;
    }
    CAM.raf = setTimeout(tick, 120);
  };

}
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function startZXing(v) {
  if (!window.ZXing) await loadScript('vendor/zxing-library-0.21.3.min.js');
  const Z = window.ZXing, hints = new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E]);

    if (!CAM.stream) return;

      const w = v.videoWidth, h = v.videoHeight, bh = Math.round(h * 0.5);

}
function stopCamera() {
  clearTimeout(CAM.raf); CAM.raf = 0;
  if (CAM.stream) { CAM.stream.getTracks().forEach(t => t.stop()); CAM.stream = null; }
  CAM.detector = null; CAM.torch = false;
}
async function toggleTorch() {
  if (!CAM.stream) return;
  CAM.torch = !CAM.torch;
  try { await CAM.stream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: CAM.torch }] }); } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { stopCamera(); if (S.tab === 'scan') render(); } });

// the same barcode is ignored for a few seconds after the camera reopens, so it isn't re-read while still in view
function fresh(code) { return !(code === CAM.last && Date.now() - CAM.lastAt < 4000); }
async function onCode(code) {
  CAM.last = code;
  stopCamera();
  if (navigator.vibrate) navigator.vibrate(60);
  render();
  await findProduct(code);
}
async function findProduct(code) {
  code = String(code).replace(/\D/g, '');
  const hit = byBarcode(code);
  if (hit) return sheetProduct(hit, { isNew: false });
  openSheet('Looking up', `<div class="small muted" style="margin-top:4px">${esc(code)}</div><div class="msg">Checking Open Food Facts…</div>`);
  let off = null, failed = false;
  try { off = await lookupOFF(code); } catch (e) { failed = true; }
  if (off && off.kcal != null) return sheetProduct(off, { isNew: true });
  sheetEdit(off || { id: code, barcode: code, name: '', brand: '', source: 'label', added: ymd() }, {
    isNew: true,
    note: failed ? 'Couldn’t reach Open Food Facts (check your connection). You can type the label values instead.'
      : off ? 'Found the name on Open Food Facts, but not the nutrition values. Copy them from the label (per 100 g column).'
      : 'This product isn’t in your catalogue or Open Food Facts yet. Copy the values from the label once, using the per 100 g column, and it’s saved for next time.',
  });

function closeSheet() { $('sheetRoot').innerHTML = ''; if (onClose) { const f = onClose; onClose = null; f(); } }

        <span>Calories <b>${f.kcal ?? '–'}</b></span><span>Protein <b>${f.protein ?? '–'} g</b></span>
        <span>Carbs <b>${f.carbs ?? '–'} g</b></span><span>Sugar <b>${f.sugar ?? '–'} g</b></span>

function viewSettings() {

        <ol class="steps">
          <li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub: new fine-grained token</a> and sign in.</li>
          <li>Name it <b>food-scanner</b>. Set expiration to 1 year.</li>
          <li>Repository access: <b>Only select repositories</b> → <b>food-scanner</b> and <b>training-data</b>.</li>
          <li>Permissions → Repository permissions → <b>Contents</b>: <b>Read and write</b>.</li>
          <li>Tap <b>Generate token</b>, copy it, and paste it below.</li>

      <div class="lbl">Training day</div>
      <div class="grid4">${tf('tTk', 'kcal', S.targets.train.kcal)}${tf('tTp', 'Protein', S.targets.train.p)}${tf('tTc', 'Carbs', S.targets.train.c)}${tf('tTf', 'Fat', S.targets.train.f)}</div>
      <div class="lbl">Every day</div>
      <div class="grid2">${tf('tRw', 'Water rest, ml', S.targets.rest.water)}${tf('tTw', 'Water training, ml', S.targets.train.water)}${tf('tSt', 'Steps', S.targets.steps)}<label class="f">Sleep, hours<input type="number" id="tSl" inputmode="decimal" step="0.25" value="${S.targets.sleep}"></label></div>
      <button class="btn block" data-act="saveTargets">Save targets</button>
    </div>
    <h2>Profile</h2>
    <div class="card">
      <div class="grid2"><label class="f">Height, m<input type="number" id="pH" inputmode="decimal" step="0.01" value="${p.height_m ?? ''}" placeholder="1.80"></label><label class="f">Goal weight, kg<input type="number" id="pG" inputmode="decimal" step="0.1" value="${p.goal_kg ?? ''}"></label></div>
      <button class="btn block" data-act="saveProfile">Save profile</button>

function setHeader() {
  const t = ymd(), dated = ['today', 'food', 'train', 'progress'].includes(S.tab);
  const dn = S.date === t ? 'Today' : S.date === shift(t, -1) ? 'Yesterday' : fmtDate(S.date, { weekday: 'long' });
  $('title').textContent = { scan: 'Scan', settings: 'Settings', progress: 'Progress', food: 'Food', train: 'Training' }[S.tab] || dn;
  $('subtitle').textContent = S.tab === 'scan' ? `Adding to ${dayWord(S.date)}` : !dated ? '' : (S.tab === 'today' ? '' : dn + ' · ') + fmtDate(S.date, { day: 'numeric', month: 'long' });
  $('goToday').hidden = !dated || S.date === t;
  $('weekrow').hidden = !dated;
  if (!dated) return;
  const ws = weekStart(S.date);
  $('nextWeek').disabled = ws >= weekStart(t);
  $('week').innerHTML = Array.from({ length: 7 }, (_, i) => { const d = shift(ws, i), x = S.log.days[d];
    const has = (x && (x.food.length || x.workouts.length || x.weight != null || x.water_ml)) || false;
    return `<button data-day="${d}" class="${has ? 'has' : ''}${d === t ? ' today' : ''}"${d === S.date ? ' aria-current="date"' : ''}${d > t ? ' disabled' : ''} aria-label="${fmtDate(d, { weekday: 'long', day: 'numeric', month: 'long' })}"><span class="wd">${fmtDate(d, { weekday: 'short' }).slice(0, 3)}</span><span class="dn">${parseD(d).getDate()}</span><span class="dt"></span></button>`; }).join('');
}
function render() {
  if (S.tab !== 'scan') stopCamera();
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
  setHeader();
  const v = $('view'), ae = document.activeElement;
  if (ae && v.contains(ae) && ae.matches('input, textarea') && S.tab !== 'scan') { setSync(); return; } // don't redraw under the cursor
  if (S.tab === 'scan' && $('video')) { setSync(); return; } // keep the live camera running
  v.innerHTML = S.tab === 'scan' ? viewScan() : S.tab === 'today' ? viewToday() : S.tab === 'food' ? viewFood() : S.tab === 'train' ? viewTrain() : S.tab === 'progress' ? viewProgress() : viewSettings();
  setSync();
  if (S.tab === 'progress') drawChart();
  if (S.tab === 'scan') {
    const q = $('q'), res = $('results'), rec = $('recent');
    q.oninput = () => {
      const s = q.value.trim().toLowerCase(), digits = s.replace(/\s/g, '');
      if (!s) { res.hidden = true; rec.hidden = false; return; }
      rec.hidden = true; res.hidden = false;
      if (/^\d{8,14}$/.test(digits)) { res.innerHTML = `<div class="item tap" data-act="lookup" data-code="${digits}"><div class="av" aria-hidden="true">#</div><div class="t"><div class="n">Look up barcode</div><div class="s">${digits}</div></div></div>`; return; }
      const hits = foods().filter(f => (f.name + ' ' + (f.brand || '')).toLowerCase().includes(s)).slice(0, 20);
      res.innerHTML = hits.map(foodRow).join('') + typeNewRow(q.value.trim());
    };
    q.onkeydown = e => { if (e.key === 'Enter') { const d = q.value.replace(/\D/g, ''); if (d.length >= 8 && d === q.value.trim()) { q.blur(); stopCamera(); findProduct(d); } } };
  }
  if (S.tab === 'food') {
    const q = $('cq');
    if (q) q.oninput = () => { const s = q.value.trim().toLowerCase(); $('catList').hidden = !s && !S.catAll; $('catAll').hidden = !!s || S.catAll; document.querySelectorAll('#catList .item').forEach(it => { it.hidden = s && !it.dataset.s.includes(s); }); };
    if (S.catAll) { $('catList').hidden = false; $('catAll').hidden = true; }
  }
}
function go(tab) { S.tab = tab; closeSheet(); $('view').innerHTML = ''; render(); window.scrollTo(0, 0); if (tab === 'scan') startCamera(); }
function goDate(date) { S.date = date > ymd() ? ymd() : date; render(); }

// ---------- events ----------
$('prevWeek').onclick = () => goDate(shift(S.date, -7));
$('nextWeek').onclick = () => goDate(shift(S.date, 7));
$('goToday').onclick = () => goDate(ymd());
$('week').addEventListener('click', e => { const b = e.target.closest('button[data-day]'); if (b && !b.disabled) goDate(b.dataset.day); });
document.addEventListener('click', e => {
  const cb = e.target.closest('.chips button');
  if (cb) { const field = cb.parentElement.dataset.field, v = Number(cb.dataset.v); return editDay(S.date, x => { x[field] = x[field] === v ? null : v; }); }
  const wd = e.target.closest('.wk-days button[data-day]'); if (wd) { if (!wd.disabled) goDate(wd.dataset.day); return; }
  const b = e.target.closest('[data-act], nav button'); if (!b) return;
  if (b.dataset.tab) return go(b.dataset.tab);
  const a = b.dataset.act;
  if (a === 'bg') { if (e.target === b) doneSheet(); return; }
  if (a === 'close') return doneSheet();
  if (a === 'settings') return go('settings');
  if (a === 'startCam') return startCamera();
  if (a === 'torch') return toggleTorch();
  if (a === 'lookup') { stopCamera(); return findProduct(b.dataset.code); }
  if (a === 'food') { const f = foods().find(x => x.id === b.dataset.id); if (f) sheetProduct(f, { isNew: false }); return; }
  if (a === 'pickFood') { const f = foods().find(x => x.id === b.dataset.id); if (f) sheetProduct(f, { isNew: false, meal: b.dataset.meal }); return; }
  if (a === 'editFood') { const f = foods().find(x => x.id === b.dataset.id); if (f) sheetEdit(f, { isNew: false, after: 'none' }); return; }
  if (a === 'newFood') return sheetEdit({ id: '', barcode: '', name: '', brand: '', source: 'label', added: ymd() }, { isNew: true, after: S.tab === 'food' && !$('sheetRoot').innerHTML ? 'none' : 'product' });
  if (a === 'addFood') return sheetAddFood(b.dataset.meal);
  if (a === 'scanFor') { S.scanMeal = b.dataset.meal; return go('scan'); }
  if (a === 'quick') return sheetQuick(b.dataset.meal || defaultMeal());
  if (a === 'typeNew') return sheetQuick(b.dataset.meal || S.scanMeal || defaultMeal(), null, b.dataset.name);
  if (a === 'entry') {
    const en = day().food.find(x => x.id === b.dataset.id); if (!en) return;
    const ent = Object.assign({}, en, { date: S.date });
    if (!en.per100) return sheetQuick(en.meal, ent);
    const f = foods().find(x => x.id === en.foodId) || { id: en.foodId, name: en.name, brand: en.brand, barcode: en.barcode, kcal: en.per100.kcal, protein: en.per100.p, carbs: en.per100.c, fat: en.per100.f, serving_g: en.serving_g, source: en.portions ? 'portion' : 'label' };
    return sheetProduct(f, { isNew: false, entry: ent });
  }
  if (a === 'saveMeal') return sheetSaveMeal(b.dataset.meal);
  if (a === 'template') return sheetTemplate(b.dataset.id);
  if (a === 'water') { const ml = Number(b.dataset.ml); editDay(S.date, x => { x.water_ml = (x.water_ml || 0) + ml; }); return toast(`+${ml} ml`); }
  if (a === 'waterSheet') return sheetWater();
  if (a === 'checkin') return sheetCheckin();
  if (a === 'dayType') return editDay(S.date, x => { x.train = b.dataset.v === '1'; });
  if (a === 'workout') return sheetWorkout();
  if (a === 'logWatch') { const x = ((H(S.date) || {}).exercise || []).find(z => z.start === b.dataset.start); if (x) sheetWorkout({ kind: /strength|weight/i.test(x.type) ? 'Gym' : 'Class', name: niceType(x.type), time: new Date(x.start).toTimeString().slice(0, 5), minutes: Math.round(x.minutes || 0) || null, kcal: x.kcal ? Math.round(x.kcal) : null, watch: x.start }); return; }
  if (a === 'delWorkout') { if (!b.dataset.arm) { b.dataset.arm = 1; b.textContent = 'Tap again to delete'; return; } return editDay(b.dataset.date || S.date, x => { x.workouts = x.workouts.filter(w => w.id !== b.dataset.id); }); }
  if (a === 'editWorkout') { const dt = b.dataset.date || S.date, w = day(dt).workouts.find(x => x.id === b.dataset.id); if (w) sheetWorkout(w, dt); return; }
  if (a === 'move') return sheetMove(b.dataset.key);
  if (a === 'moreSess') { S.moreSess = true; return render(); }
  if (a === 'catAll') { S.catAll = true; $('catList').hidden = false; b.hidden = true; return; }
  if (a === 'prMode') { S.prMode = b.dataset.mode; return render(); }
  if (a === 'openPR') return sheetPR(b.dataset.name, b.dataset.kind, b.dataset.unit);
  if (a === 'newPR') return sheetNewPR();
  if (a === 'measure') return sheetMeasure();
  if (a === 'range') { S.chartRange = Number(b.dataset.n); return render(); }
  if (a === 'download') { const blob = new Blob([toCSV(foods())], { type: 'text/csv;charset=utf-8' }); const u = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = u; l.download = 'foods.csv'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); return; }
  if (a === 'saveToken') { const t = $('tok').value.trim(); if (!t) return $('tok').focus(); S.token = t; save(LS.token, t); S.syncErr = null; S.lerr = null; render(); pull().then(() => { render(); sync(); }); syncAll(); return; }
  if (a === 'clearToken') { S.token = ''; save(LS.token, ''); return render(); }
  if (a === 'syncNow') { S.syncErr = null; S.lerr = null; push(); syncAll().then(render); return; }
  if (a === 'saveTargets') {
    const g = id => num($(id).value);
    S.targets = { rest: { kcal: g('tRk') || 1750, p: g('tRp') || 150, c: g('tRc'), f: g('tRf'), water: g('tRw') || 2800 }, train: { kcal: g('tTk') || 2000, p: g('tTp') || 170, c: g('tTc'), f: g('tTf'), water: g('tTw') || 3500 }, steps: g('tSt') || 9000, sleep: g('tSl') || 7.5 };
    save(LS.targets, S.targets); return toast('Targets saved');
  }
  if (a === 'saveProfile') { let h = num($('pH').value); if (h && h > 3) h = r1(h) / 100; S.log.profile = Object.assign({}, S.log.profile, { height_m: h, goal_kg: num($('pG').value), updatedAt: new Date().toISOString() }); markDirty('profile.json'); return toast('Profile saved'); }
});
document.addEventListener('change', e => { if (e.target.id === 'dayNote') { const v = e.target.value.trim(); e.target.blur(); editDay(S.date, x => { x.note = v; }); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

pull().then(() => { if (S.tab !== 'scan') render(); else setSync(); sync(); });
