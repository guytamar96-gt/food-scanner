<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<title>Food Scanner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap">
<style>
/* Graphite: near-black, one lime accent, quiet cards. Scan view uses the Mono camera frame. */
:root {
  --bg: #0B0B0C; --panel: #151517; --panel2: #1C1C1F; --line: #26262A; --hair: #1F1F22;
  --text: #F4F4F5; --muted: #9A9AA3; --dim: #6B6B73;
  --accent: #C8F135; --accent-ink: #0B0B0C; --danger: #F87171; --warn: #F5B83D;
  --protein: #60A5FA; --carbs: #F5B83D; --fat: #A78BFA;
  --display: "Inter Tight", Inter, system-ui, sans-serif;
  --radius: 20px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
body { padding-bottom: calc(88px + env(safe-area-inset-bottom)); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(18px + env(safe-area-inset-top)) 20px 12px; display: flex; align-items: center; gap: 10px; max-width: 600px; margin: 0 auto; }
header h1 { font-family: var(--display); font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 0; flex: 1; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.sync.busy i { background: var(--warn); }
.sync.err { color: var(--danger); }
.sync.err i { background: var(--danger); }
main { padding: 4px 20px 20px; max-width: 600px; margin: 0 auto; }
nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--bg); border-top: 1px solid var(--hair); padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); }
nav button { background: none; border: 0; color: #8A8A93; padding: 6px 0; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; }
nav button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav button[aria-selected="true"] { color: var(--accent); }
h2 { font-size: 12px; margin: 22px 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; display: flex; justify-content: space-between; }
h2 span { text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 500; }
.card { background: var(--panel); border-radius: var(--radius); padding: 18px; margin-bottom: 12px; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-weight: 600; border-radius: 16px; min-height: 52px; padding: 0 18px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; font-size: 16px; }
.btn.danger { color: var(--danger); }
.btn.block { width: 100%; margin-top: 10px; }
.btn:disabled { opacity: .4; }
.link { background: none; border: 0; color: var(--muted); font-size: 14px; font-weight: 600; padding: 12px 4px; text-decoration: underline; text-underline-offset: 3px; }
.row { display: flex; gap: 10px; align-items: center; }
.row > * { flex: 1; }
input, select, textarea { width: 100%; background: var(--panel); color: var(--text); border: 1px solid transparent; border-radius: 14px; padding: 13px 14px; font-size: 16px; }
input:focus, select:focus, textarea:focus { border-color: var(--line); outline: none; }
textarea { min-height: 80px; font-size: 13px; }
label.f { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 12px; }
label.f input, label.f select { margin-top: 6px; background: var(--panel2); }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.grid4 label.f { margin-top: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.msg { background: var(--panel2); border-radius: 14px; padding: 12px 14px; font-size: 14px; margin: 12px 0; color: #D4D4D8; }
.msg.warn { color: #F3DFAE; }
.msg.err { color: #FCA5A5; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 99px; background: var(--panel2); color: var(--muted); }
.pill.new { color: var(--accent); background: rgba(200, 241, 53, .1); }
/* scan: Mono-style frame */
.viewer { position: relative; border-radius: 6px; overflow: hidden; background: #050506; aspect-ratio: 1 / 1; max-height: 52vh; width: 100%; border: 1px solid var(--hair); }
.viewer video { width: 100%; height: 100%; object-fit: cover; display: block; }
.viewer .corner { position: absolute; width: 20px; height: 20px; border: 0 solid #fff; pointer-events: none; }
.viewer .tl { left: 12%; top: 32%; border-left-width: 2px; border-top-width: 2px; }
.viewer .tr { right: 12%; top: 32%; border-right-width: 2px; border-top-width: 2px; }
.viewer .bl { left: 12%; bottom: 32%; border-left-width: 2px; border-bottom-width: 2px; }
.viewer .br { right: 12%; bottom: 32%; border-right-width: 2px; border-bottom-width: 2px; }
.viewer .line { position: absolute; left: 12%; right: 12%; top: 50%; height: 1px; background: var(--accent); pointer-events: none; }
.viewer .cap { position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #B9B9C0; pointer-events: none; }
.viewer .idle { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--muted); text-align: center; padding: 24px; background: #050506; }
.viewer .torch { position: absolute; right: 12px; top: 12px; width: 44px; height: 44px; border-radius: 22px; background: rgba(255, 255, 255, .1); border: 0; display: flex; align-items: center; justify-content: center; }
.viewer .torch svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.search { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #3A3A3F; margin-top: 18px; }
.search input { background: none; border: 0; border-radius: 0; padding: 14px 0; }
.search svg { width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; flex: none; }
/* lists */
.list .item { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--hair); }
.list .item:last-child { border-bottom: 0; }
.list .item .t { flex: 1; min-width: 0; }
.list .item .n { font-weight: 600; overflow-wrap: anywhere; }
.list .item .s { font-size: 13px; color: var(--muted); }
.list .item .k { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.list .item .av { width: 40px; height: 40px; border-radius: 12px; background: var(--panel2); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--accent); flex: none; }
.list .item .plus { width: 18px; height: 18px; fill: none; stroke: var(--dim); stroke-width: 2; stroke-linecap: round; flex: none; }
.tap { cursor: pointer; }
.empty { color: var(--muted); font-size: 14px; padding: 10px 0; }
/* product */
.hero { background: var(--panel); border-radius: 24px; padding: 22px; margin: 16px 0; }
.hero .big { display: flex; align-items: baseline; gap: 8px; }
.hero .big b { font-family: var(--display); font-size: 56px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.hero .big span { font-size: 15px; color: var(--muted); }
.macros3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
.macros3 i { display: block; height: 4px; border-radius: 2px; margin-bottom: 8px; }
.macros3 b { display: block; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.macros3 span { font-size: 12px; color: var(--muted); }
.lbl { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 10px; display: block; }
.stepper { display: flex; align-items: center; gap: 8px; height: 60px; border-radius: 16px; background: var(--panel); padding: 0 8px; }
.stepper button { width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--panel2); font-size: 22px; flex: none; }
.stepper input { flex: 1; min-width: 0; background: none; border: 0; text-align: center; font-family: var(--display); font-size: 24px; font-weight: 700; padding: 0; }
.stepper .unit { font-size: 15px; color: var(--muted); margin-right: 4px; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.quick button { background: var(--panel2); border: 0; border-radius: 99px; padding: 9px 13px; font-size: 13px; color: #D4D4D8; min-height: 36px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--panel); border-radius: 14px; padding: 4px; }
.seg button { background: none; border: 0; color: var(--muted); font-size: 13px; padding: 11px 0; border-radius: 10px; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); font-weight: 600; }
.per100 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 16px; font-size: 13px; color: var(--muted); }
.per100 b { color: var(--text); font-weight: 600; }
details summary { cursor: pointer; list-style: none; }
details summary::-webkit-details-marker { display: none; }
/* today */
.daytype { background: var(--panel); border: 0; border-radius: 99px; padding: 8px 14px; font-size: 13px; font-weight: 600; min-height: 36px; }
.daytype.on { background: rgba(200, 241, 53, .12); color: var(--accent); }
.summary { display: flex; align-items: center; gap: 20px; }
.ring { position: relative; width: 132px; height: 132px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .c b { font-family: var(--display); font-size: 30px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.ring .c span { font-size: 12px; color: var(--muted); }
.mbars { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.mbars .r1 { display: flex; justify-content: space-between; font-size: 13px; }
.mbars .r1 span { color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; border-radius: 3px; }
@media (max-width: 360px) { .summary { flex-direction: column; } .mbars { width: 100%; } }
/* sheets */
.sheet-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, .65); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 600px; max-height: 94vh; overflow: auto; border-radius: 28px 28px 0 0; padding: 18px 20px calc(24px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
.sheet h3 { margin: 0; font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.sheet .top { display: flex; align-items: flex-start; gap: 12px; }
.sheet .top h3 { flex: 1; padding-top: 6px; }
.x { background: var(--panel); border: 0; border-radius: 22px; width: 44px; height: 44px; font-size: 20px; flex: none; }
.toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 99px; font-size: 14px; font-weight: 600; z-index: 30; max-width: 90vw; text-align: center; white-space: nowrap; }
ol.steps { padding-left: 20px; margin: 8px 0; font-size: 14px; }
ol.steps li { margin-bottom: 8px; }
a { color: var(--accent); }
[dir="auto"] { unicode-bidi: plaintext; text-align: left; }
</style>
</head>
<body>
<header><h1 id="title">Scan</h1><span id="sync" class="sync"></span></header>
<main id="view"></main>
<nav>
  <button data-tab="scan" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M8 8v8M12 8v8M16 8v8"/></svg>Scan</button>
  <button data-tab="today" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Today</button>
  <button data-tab="catalogue" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>Foods</button>
  <button data-tab="settings" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</button>
</nav>
<div id="sheetRoot"></div>
<script>
'use strict';
// ---------- config ----------
const REPO = 'guytamar96-gt/food-scanner';
const FILE = 'foods.csv';
const TRACKER_URL = 'https://claude.ai/artifact/2C135dawP3hZrfnRUUw52L';
const MEALS = ['Breakfast', 'Lunch', 'Dinner', 'Snacks'];
const COLS = ['id', 'barcode', 'name', 'brand', 'kcal', 'protein', 'carbs', 'fat', 'sugar', 'sat_fat', 'fibre', 'sodium_mg', 'serving_g', 'source', 'added'];
const NUMS = ['kcal', 'protein', 'carbs', 'fat', 'sugar', 'sat_fat', 'fibre', 'sodium_mg', 'serving_g'];
const DEFAULT_TARGETS = { rest: { kcal: 1750, p: 150 }, train: { kcal: 2000, p: 170 } };
const LS = { cat: 'fs-catalogue', pending: 'fs-pending', days: 'fs-days', token: 'fs-token', targets: 'fs-targets', train: 'fs-train', sha: 'fs-sha' };

// ---------- helpers ----------
const $ = id => document.getElementById(id);
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function num(v) { if (v === '' || v == null) return null; const n = Number(String(v).replace(',', '.')); return isFinite(n) ? n : null; }
function r1(n) { return Math.round(n * 10) / 10; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function ymd(d = new Date()) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9֐-׿]+/g, '-').replace(/^-|-$/g, '').slice(0, 50) || uid(); }
function load(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2400); }
function utf8ToB64(s) { const b = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(bin); }
function b64ToUtf8(s) { const bin = atob(s.replace(/\s/g, '')); const b = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return new TextDecoder().decode(b); }
function defaultMeal() { const h = new Date().getHours(); return h < 11 ? 'Breakfast' : h < 16 ? 'Lunch' : h < 18 ? 'Snacks' : 'Dinner'; }

// ---------- CSV ----------
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); f = ''; if (row.length > 1 || row[0] !== '') rows.push(row); row = []; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  const head = rows.shift() || [];
  return rows.map(r => { const o = {}; head.forEach((h, i) => { o[h] = r[i] ?? ''; }); for (const k of NUMS) o[k] = num(o[k]); return o; }).filter(o => o.id);
}
function toCSV(list) {
  const cell = v => { v = v == null ? '' : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const sorted = list.slice().sort((a, b) => (a.added || '').localeCompare(b.added || '') || a.name.localeCompare(b.name));
  return '﻿' + [COLS.join(','), ...sorted.map(o => COLS.map(k => cell(o[k])).join(','))].join('\n') + '\n';
}

// ---------- state ----------
const S = {
  tab: 'scan',
  cat: load(LS.cat, []),              // last known catalogue from GitHub
  pending: load(LS.pending, []),      // [{op:'put',food}|{op:'del',id}] not yet saved to GitHub
  days: load(LS.days, {}),
  token: load(LS.token, ''),
  targets: load(LS.targets, DEFAULT_TARGETS),
  train: load(LS.train, {}),          // {date: true}
  sha: load(LS.sha, null),
  syncing: false, syncErr: null,
};
function foods() { // catalogue with this phone's unsynced edits applied
  const m = new Map(S.cat.map(f => [f.id, f]));
  for (const p of S.pending) { if (p.op === 'put') m.set(p.food.id, p.food); else m.delete(p.id); }
  return [...m.values()];
}
function byBarcode(code) { return foods().find(f => f.barcode && f.barcode === code); }
function today() { const d = ymd(); if (!S.days[d]) S.days[d] = []; return S.days[d]; }
function saveDays() { const keys = Object.keys(S.days).sort(); for (const k of keys.slice(0, Math.max(0, keys.length - 45))) delete S.days[k]; save(LS.days, S.days); }

function putFood(food) {
  S.pending = S.pending.filter(p => (p.op === 'put' ? p.food.id : p.id) !== food.id);
  S.pending.push({ op: 'put', food }); save(LS.pending, S.pending); sync();
}
function delFood(id) {
  S.pending = S.pending.filter(p => (p.op === 'put' ? p.food.id : p.id) !== id);
  S.pending.push({ op: 'del', id }); save(LS.pending, S.pending); sync();
}

// ---------- GitHub sync ----------
function setSync() {
  const el = $('sync'); if (!el || S.tab === 'today') return;
  const n = S.pending.length;
  el.className = 'sync' + (S.syncErr ? ' err' : S.syncing || n ? ' busy' : '');
  el.innerHTML = '<i></i>' + esc(S.syncing ? 'Saving…' : S.syncErr ? S.syncErr : n ? `${n} not saved yet` : 'Synced');
}
async function gh(path, opts = {}) {
  const r = await fetch('https://api.github.com/repos/' + REPO + path, Object.assign({}, opts, { headers: Object.assign({ Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + S.token, 'X-GitHub-Api-Version': '2022-11-28' }, opts.headers || {}) }));
  if (!r.ok) { const e = new Error('github ' + r.status); e.status = r.status; throw e; }
  return r.json();
}
async function pull() {
  try {
    if (S.token) {
      const j = await gh('/contents/' + FILE + '?ref=main&t=' + Date.now(), { cache: 'no-store' });
      S.sha = j.sha; save(LS.sha, S.sha);
      S.cat = parseCSV(b64ToUtf8(j.content || ''));
    } else {
      const r = await fetch(FILE + '?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('csv ' + r.status);
      S.cat = parseCSV(await r.text());
    }
    save(LS.cat, S.cat); S.syncErr = null;
  } catch (e) {
    S.syncErr = e.status === 401 || e.status === 403 ? 'GitHub key not accepted' : navigator.onLine ? 'Couldn’t load catalogue' : 'Offline';
  }
}
let syncTimer = null;
function sync() { clearTimeout(syncTimer); syncTimer = setTimeout(push, 400); setSync(); }
async function push(retry = true) {
  if (S.syncing) return sync();
  if (!S.pending.length) { setSync(); return; }
  if (!S.token) { S.syncErr = null; setSync(); return; }
  S.syncing = true; setSync();
  const batch = S.pending.slice();
  try {
    await pull();
    if (S.syncErr) throw new Error(S.syncErr);
    const m = new Map(S.cat.map(f => [f.id, f]));
    for (const p of batch) { if (p.op === 'put') m.set(p.food.id, p.food); else m.delete(p.id); }
    const list = [...m.values()];
    const names = batch.filter(p => p.op === 'put').map(p => p.food.name);
    const msg = names.length === 1 ? 'Add ' + names[0] : names.length ? `Update ${names.length} foods` : 'Remove food';
    const j = await gh('/contents/' + FILE, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: msg, content: utf8ToB64(toCSV(list)), sha: S.sha || undefined, branch: 'main' }) });
    S.sha = j.content.sha; save(LS.sha, S.sha);
    S.cat = list; save(LS.cat, S.cat);
    S.pending = S.pending.filter(p => !batch.includes(p)); save(LS.pending, S.pending);

async function lookupOFF(code) {
  const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=code,product_name,product_name_he,product_name_en,brands,nutriments,serving_quantity`);
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('off ' + r.status);
  const j = await r.json();
  if (!j || j.status !== 1 || !j.product) return null;
  const p = j.product, n = p.nutriments || {};
  const g = k => num(n[k + '_100g']);
  let kcal = g('energy-kcal'); if (kcal == null && g('energy') != null) kcal = g('energy') / 4.184;
  const sodium = g('sodium') != null ? g('sodium') * 1000 : g('salt') != null ? g('salt') * 400 : null;
  return {
    id: code, barcode: code,
    name: (p.product_name_he || p.product_name || p.product_name_en || '').trim(),
    brand: (p.brands || '').split(',')[0].trim(),
    kcal: kcal == null ? null : Math.round(kcal), protein: r1n(g('proteins')), carbs: r1n(g('carbohydrates')), fat: r1n(g('fat')),
    sugar: r1n(g('sugars')), sat_fat: r1n(g('saturated-fat')), fibre: r1n(g('fiber')), sodium_mg: sodium == null ? null : Math.round(sodium),
    serving_g: num(p.serving_quantity) || null, source: 'Open Food Facts', added: ymd(),

}

  } catch (e) {

}

    <div class="small muted" style="text-align:center;margin:-4px 0 4px">${Math.round(t.kcal).toLocaleString()} eaten of ${T.kcal.toLocaleString()} kcal</div>
    ${MEALS.map(m => { const es = items.filter(e => e.meal === m); return `<h2>${m}<span>${es.length ? Math.round(totals(es).kcal) + ' kcal' : ''}</span></h2>
      <div class="list">${es.map(e => `<div class="item tap" data-act="entry" data-id="${esc(e.id)}"><div class="t"><div class="n" dir="auto">${esc(e.name)}</div><div class="s">${e.grams} g · P ${Math.round(e.p)}</div></div><div class="k">${e.kcal}</div></div>`).join('') || '<div class="empty">Nothing yet</div>'}</div>`; }).join('')}
    <button class="btn block" data-act="send" style="margin-top:24px" ${items.length ? '' : 'disabled'}>Send today to tracker</button>`;
}
function viewCatalogue() {
  const list = foods().sort((a, b) => a.name.localeCompare(b.name));
  return `
    <div class="row"><input type="search" id="cq" placeholder="Search ${list.length} foods" aria-label="Search the catalogue"><button class="btn" data-act="newFood" style="flex:0 0 auto">+ New</button></div>
    <div class="list" id="catList" style="margin-top:8px">${list.map(f => catRow(f)).join('') || '<div class="empty">No foods yet.</div>'}</div>
    <button class="btn block" data-act="download">Download catalogue (CSV)</button>
    <p class="small muted">The catalogue is the file <a href="https://github.com/${REPO}/blob/main/${FILE}" target="_blank" rel="noopener">${FILE}</a> on GitHub. Every food you scan or add is saved there.</p>`;
}
function catRow(f) { return `<div class="item tap" data-act="food" data-id="${esc(f.id)}" data-s="${esc((f.name + ' ' + (f.brand || '') + ' ' + (f.barcode || '')).toLowerCase())}"><div class="av" dir="auto" aria-hidden="true">${esc(initials(f.name))}</div><div class="t"><div class="n" dir="auto">${esc(f.name)}</div><div class="s" dir="auto">${esc(f.brand || '')}${f.brand ? ' · ' : ''}${f.kcal} kcal · P ${f.protein} per 100 g</div></div></div>`; }
function viewSettings() {
  const n = S.pending.length;
  return `
    <h2>Saving to GitHub</h2>
    <div class="card">
      ${S.token ? `<div>GitHub key is set. ${n ? `<b>${n}</b> change${n === 1 ? '' : 's'} waiting to save.` : 'Everything is saved.'}</div>${S.syncErr ? `<div class="msg err">${esc(S.syncErr)}</div>` : ''}
        <div class="row" style="margin-top:10px"><button class="btn" data-act="syncNow">Save now</button><button class="btn danger" data-act="clearToken">Remove key</button></div>`
      : `<div class="msg warn">Without a GitHub key, new foods are kept on this phone only. Add the key once and they’re saved to the catalogue file.</div>
        <ol class="steps">
          <li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub: new fine-grained token</a> and sign in.</li>
          <li>Name it <b>food-scanner</b>. Set expiration to 1 year.</li>
          <li>Repository access: <b>Only select repositories</b> → <b>food-scanner</b>.</li>
          <li>Permissions → Repository permissions → <b>Contents</b>: <b>Read and write</b>.</li>
          <li>Tap <b>Generate token</b>, copy it, and paste it below.</li>
        </ol>
        <input type="password" id="tok" placeholder="github_pat_…" autocomplete="off" aria-label="GitHub key">
        <button class="btn primary block" data-act="saveToken">Save key</button>`}
    </div>
    <h2>Daily targets</h2>
    <div class="card">
      <div class="grid2">
        <label class="f">Rest kcal<input type="number" id="tRk" inputmode="numeric" value="${S.targets.rest.kcal}"></label>
        <label class="f">Rest protein<input type="number" id="tRp" inputmode="numeric" value="${S.targets.rest.p}"></label>
        <label class="f">Train kcal<input type="number" id="tTk" inputmode="numeric" value="${S.targets.train.kcal}"></label>
        <label class="f">Train protein<input type="number" id="tTp" inputmode="numeric" value="${S.targets.train.p}"></label>
      </div>
      <button class="btn block" data-act="saveTargets">Save targets</button>
    </div>
    <h2>Add to home screen</h2>
    <div class="card small">In Chrome or Samsung Internet, open the menu and tap <b>Add to Home screen</b>. The scanner then opens like an app.</div>`;
}
function render() {
  if (S.tab !== 'scan') stopCamera();
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
  $('title').textContent = { scan: 'Scan', today: 'Today', catalogue: 'Foods', settings: 'Settings' }[S.tab];
  const v = $('view');
  v.innerHTML = S.tab === 'scan' ? viewScan() : S.tab === 'today' ? viewToday() : S.tab === 'catalogue' ? viewCatalogue() : viewSettings();
  setSync();
  if (S.tab === 'today') {
    const tr = !!S.train[ymd()], sy = $('sync');
    sy.className = ''; sy.innerHTML = `<button class="daytype${tr ? ' on' : ''}" data-act="dayType" data-v="${tr ? 0 : 1}" aria-label="Switch to ${tr ? 'rest' : 'training'} day">${tr ? 'Training day' : 'Rest day'}</button>`;
  }
  if (S.tab === 'scan') {
    const q = $('q'), res = $('results'), rec = $('recent');
    q.oninput = () => {
      const s = q.value.trim().toLowerCase(), digits = s.replace(/\s/g, '');
      if (!s) { res.hidden = true; rec.hidden = false; return; }
      rec.hidden = true; res.hidden = false;
      if (/^\d{8,14}$/.test(digits)) { res.innerHTML = `<div class="item tap" data-act="lookup" data-code="${digits}"><div class="av" aria-hidden="true">#</div><div class="t"><div class="n">Look up barcode</div><div class="s">${digits}</div></div></div>`; return; }
      const hits = foods().filter(f => (f.name + ' ' + (f.brand || '')).toLowerCase().includes(s)).slice(0, 20);
      res.innerHTML = hits.map(foodRow).join('') || '<div class="empty">No match. Add it under Foods → New.</div>';
    };
    q.onkeydown = e => { if (e.key === 'Enter') { const d = q.value.replace(/\D/g, ''); if (d.length >= 8 && d === q.value.trim()) { q.blur(); stopCamera(); findProduct(d); } } };
  }
  if (S.tab === 'catalogue') {
    const q = $('cq');
    q.oninput = () => { const s = q.value.trim().toLowerCase(); document.querySelectorAll('#catList .item').forEach(it => { it.hidden = s && !it.dataset.s.includes(s); }); };
  }
}

// ---------- events ----------
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act], nav button'); if (!b) return;
  if (b.dataset.tab) { S.tab = b.dataset.tab; closeSheet(); render(); if (S.tab === 'scan') startCamera(); return; }
  const a = b.dataset.act;
  if (a === 'bg') { if (e.target === b) doneSheet(); return; }
  if (a === 'close') return doneSheet();
  if (a === 'startCam') return startCamera();
  if (a === 'torch') return toggleTorch();
  if (a === 'lookup') { stopCamera(); return findProduct(b.dataset.code); }
  if (a === 'food') { const f = foods().find(x => x.id === b.dataset.id); if (!f) return; return S.tab === 'catalogue' ? sheetEdit(f, { isNew: false, after: 'none' }) : sheetProduct(f, { isNew: false }); }
  if (a === 'newFood') return sheetEdit({ id: '', barcode: '', name: '', brand: '', source: 'label', added: ymd() }, { isNew: true, after: 'none' });
  if (a === 'entry') { const d = ymd(), en = (S.days[d] || []).find(x => x.id === b.dataset.id); if (!en) return; const f = foods().find(x => x.id === en.foodId) || { id: en.foodId, name: en.name, brand: en.brand, barcode: en.barcode, kcal: en.per100.kcal, protein: en.per100.p, carbs: en.per100.c, fat: en.per100.f, serving_g: en.serving_g, source: 'label' }; return sheetProduct(f, { isNew: false, entry: Object.assign({}, en, { date: d }) }); }
  if (a === 'dayType') { const d = ymd(); if (b.dataset.v === '1') S.train[d] = true; else delete S.train[d]; save(LS.train, S.train); return render(); }
  if (a === 'send') return sheetSend();
  if (a === 'download') { const blob = new Blob([toCSV(foods())], { type: 'text/csv;charset=utf-8' }); const u = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = u; l.download = 'foods.csv'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); return; }
  if (a === 'saveToken') { const t = $('tok').value.trim(); if (!t) return $('tok').focus(); S.token = t; save(LS.token, t); S.syncErr = null; render(); pull().then(() => { render(); sync(); }); return; }
  if (a === 'clearToken') { S.token = ''; save(LS.token, ''); return render(); }
  if (a === 'syncNow') { S.syncErr = null; return push(); }
  if (a === 'saveTargets') { const g = id => num($(id).value); S.targets = { rest: { kcal: g('tRk') || 1750, p: g('tRp') || 150 }, train: { kcal: g('tTk') || 2000, p: g('tTp') || 170 } }; save(LS.targets, S.targets); return toast('Targets saved'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

// ---------- start ----------
render();
pull().then(() => { if (S.tab !== 'scan') render(); else setSync(); sync(); });
// open the camera straight away when the phone already allowed it
if (navigator.permissions && navigator.permissions.query) navigator.permissions.query({ name: 'camera' }).then(p => { if (p.state === 'granted' && S.tab === 'scan' && !CAM.stream) startCamera(); }).catch(() => {});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
